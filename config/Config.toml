[input]
mode = 'single' # single | multiline

[learning]
shuffle = false
random_seed = 42

[spell]
tau_ratio = 0.75

[tokenizer]
delimiters = '[ =,:()\[\]\t\n\r]+'
extra_delimiters = []
use_jieba = true

[[tokenizer.mask_patterns]]
name = 'datetime'
pattern = '\b(?:\d{4}/\d{1,2}/\d{1,2})\s+(?:[01]?\d|2[0-3]):[0-5]\d\b'

[[tokenizer.mask_patterns]]
name = 'ipv4'
pattern = '\b(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)){3}\b'

[header]
parse_structure = '<context>'
strict_mode = false

[header.field_patterns]

[output]
dir = 'output'
parsed_file = 'parsed_results.jsonl'
template_file = 'templates.txt'
show_tokens = false
